<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shree Anandhaas – Employee Attendance</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hind+Madurai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#019972;--gd:#016b50;--y:#FFDD00;--cream:#FFFBE3;--ink:#10241d;--line:#d9e9c9;--card:#fff;--muted:#4d6a5e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cream:#0d1f19;--card:#14302a;--ink:#f4f8e8;--line:#245246;--muted:#a9c7b8}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:'Hind Madurai',system-ui,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0)}
header{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 54px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:var(--y);opacity:.95}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1;max-width:560px;margin:0 auto}
.brand img{width:62px;height:62px;border-radius:50%;border:3px solid var(--y)}
.brand small{display:block;font-size:13px;letter-spacing:.04em;opacity:.9}
.brand b{font-family:'Young Serif',serif;font-weight:400;font-size:27px;line-height:1.1}
main{max-width:560px;margin:-34px auto 0;padding:0 16px 40px;position:relative;z-index:2}
.top{background:var(--y);color:#10241d;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;box-shadow:0 6px 0 var(--gd)}
.top span{font-size:14px;font-weight:600}
.top b{font-family:'Young Serif',serif;font-weight:400;font-size:22px;display:block;line-height:1.2}
.step{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.step h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:10px}
.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700}
.step.done .n{background:var(--y);color:#10241d}
#cam{display:none}
.shot{display:grid;place-items:center;min-height:190px;border:2.5px dashed var(--g);border-radius:14px;background:rgba(1,153,114,.07);cursor:pointer;overflow:hidden;text-align:center;color:var(--gd);font-weight:600}
.shot img{width:100%;max-height:300px;object-fit:cover;display:none}
.shot svg{width:46px;height:46px;stroke:var(--g);fill:none;stroke-width:1.8;display:block;margin:0 auto 6px}
.btn{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:12px;border:2px solid var(--g);background:none;color:var(--gd);font:600 15px 'Hind Madurai',sans-serif;cursor:pointer}
.grid{display:none;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.grid.open{display:grid}
.dd{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:12px;border:2px solid var(--g);background:none;color:var(--ink);font:600 17px 'Hind Madurai',sans-serif;cursor:pointer}
.dd::after{content:"▾";color:var(--g);font-size:18px}
.chip{padding:12px 10px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--ink);font:600 15px 'Hind Madurai',sans-serif;text-align:left;cursor:pointer}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.stamp{display:flex;gap:12px}
.stamp div{flex:1;background:rgba(1,153,114,.09);border-radius:12px;padding:10px 14px}
.stamp small{display:block;color:var(--muted);font-size:13px}
.stamp b{font-size:19px}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io button{padding:18px 8px;border-radius:14px;border:2px solid var(--line);background:none;color:var(--ink);font:700 20px 'Hind Madurai',sans-serif;cursor:pointer}
.io button[aria-pressed=true]{border-color:var(--g);background:var(--g);color:#fff}
.io button[data-v=OUT][aria-pressed=true]{background:var(--y);border-color:var(--y);color:#10241d}
label{font-size:14px;color:var(--muted);font-weight:600;display:block;margin:0 0 4px}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 18px 'Hind Madurai',sans-serif;text-transform:uppercase}
input.name{text-transform:none;background:rgba(255,221,0,.25);margin-bottom:0}
.msg{min-height:20px;font-size:14px;margin:6px 0 10px;color:#b3261e}
.submit{width:100%;padding:17px;border:0;border-radius:16px;background:var(--g);color:#fff;font:700 20px 'Hind Madurai',sans-serif;box-shadow:0 6px 0 var(--gd);cursor:pointer}
.submit:active{transform:translateY(3px);box-shadow:0 3px 0 var(--gd)}
button:focus-visible,input:focus-visible,.shot:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.ok{display:none;text-align:center;background:var(--card);border:2px solid var(--g);border-radius:18px;padding:30px 18px}
.ok .tick{width:70px;height:70px;border-radius:50%;background:var(--y);color:var(--gd);display:grid;place-items:center;font-size:38px;margin:0 auto 10px}
.ok h2{font-family:'Young Serif',serif;font-weight:400;margin:0 0 4px}
</style>
</head>
<body>

<main>
  <div class="top"><span>Employee attendance<b id="today">–</b></span><b id="clock">–</b></div>

  <div id="formWrap">
    <section class="step" id="s1">
      <h2><span class="n">1</span>Take your photo</h2>
      <input id="cam" type="file" accept="image/*" capture="user">
      <div class="shot" id="shot" tabindex="0" role="button" aria-label="Open camera">
        <div id="shotHint"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Tap to open camera</div>
        <img id="prev" alt="Your photo">
      </div>
      <button class="btn" id="retake" style="display:none">Retake photo</button>
    </section>

    <section class="step" id="s2">
      <h2><span class="n">2</span>Choose your branch</h2>
      <button class="dd" id="dd" type="button"><span id="ddl">Branches</span></button>
      <div class="grid" id="branches"></div>
    </section>

    <section class="step" id="s3">
      <h2><span class="n">3</span>Date and time</h2>
      <div class="stamp"><div><small>Date</small><b id="d">–</b></div><div><small>Time</small><b id="t">–</b></div></div>
    </section>

    <section class="step" id="s4">
      <h2><span class="n">4</span>In or Out</h2>
      <div class="io"><button data-v="IN" aria-pressed="false">IN</button><button data-v="OUT" aria-pressed="false">OUT</button></div>
    </section>

    <section class="step" id="s5">
      <h2><span class="n">5</span>Employee details</h2>
      <label for="code">Employee code</label>
      <input id="code" type="text" placeholder="RE001" maxlength="5" autocomplete="off" style="margin-bottom:12px">
      <label for="nm">Name</label>
      <input id="nm" class="name" type="text" readonly placeholder="Name appears here">
    </section>

    <div class="msg" id="msg" role="alert"></div>
    <button class="submit" id="go">Submit attendance</button>
  </div>

  <div class="ok" id="ok">
    <div class="tick">✓</div>
    <h2>Attendance submitted</h2>
    <p id="okTxt"></p>
    <button class="btn" onclick="location.reload()">Mark another</button>
  </div>
</main>
<script>
const BRANCHES=["Mugappair","Kolathur","Porur","Selaiyur","Pallavaram","Palavakkam","Avadi","Adyar","Ambattur","Kolathur (Second Branch)"];
const EMP={RE001:"Thashnamurthy",RE002:"Lokesh",RE003:"Sridhar",RE004:"Thilip",RE005:"Ignesh",RE006:"Jagan",RE007:"Jagannathan",RE008:"Manoj",RE009:"Krishnan",RE010:"Ramesh"};
const $=id=>document.getElementById(id);
let branch="",io="",photo="";
const bw=$("branches");
BRANCHES.forEach(b=>{const e=document.createElement("button");e.className="chip";e.textContent=b;e.setAttribute("aria-pressed","false");
  e.onclick=()=>{branch=b;[...bw.children].forEach(c=>c.setAttribute("aria-pressed",c===e));$("ddl").textContent=b;bw.classList.remove("open");$("s2").classList.add("done")};bw.appendChild(e)});
function tick(){const n=new Date();
  const d=n.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
  const t=n.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  $("d").textContent=d;$("t").textContent=t;$("today").textContent=d;$("clock").textContent=t;$("s3").classList.add("done")}
["d","t","today","clock"].forEach(i=>$(i).textContent="–");
$("dd").onclick=()=>bw.classList.toggle("open");
const open=()=>$("cam").click();
$("shot").onclick=open;$("shot").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")open()};$("retake").onclick=open;
$("cam").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{photo=r.result;ts=Date.now();tick();$("prev").src=photo;$("prev").style.display="block";$("shotHint").style.display="none";$("retake").style.display="inline-block";$("s1").classList.add("done")};r.readAsDataURL(f)};
document.querySelectorAll(".io button").forEach(b=>b.onclick=()=>{io=b.dataset.v;document.querySelectorAll(".io button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("s4").classList.add("done")});
$("code").oninput=e=>{const c=e.target.value.trim().toUpperCase();$("nm").value=EMP[c]||"";$("s5").classList.toggle("done",!!EMP[c])};
const API="https://script.google.com/macros/s/AKfycbwJcg3Sgq_v7BrZLHmQokLKzz7v5cSup8GdMYN9vujfT2yhhFuYv23ioRCjxEN5EgH2/exec";
let ts=Date.now();
function shrink(src){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height));const c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.6))};i.onerror=()=>res(src);i.src=src})}
$("go").onclick=async()=>{const c=$("code").value.trim().toUpperCase();let m="";
  if(!photo)m="Take your photo first.";else if(!branch)m="Choose your branch.";else if(!io)m="Select IN or OUT.";else if(!EMP[c])m="Enter a valid employee code (RE001 to RE010).";
  $("msg").textContent=m;if(m)return;
  const btn=$("go");btn.disabled=true;btn.textContent="Submitting…";
  try{
    const small=await shrink(photo);
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({code:c,type:io,branch:branch,photo:small,timestamp:ts})});
    const j=await r.json();if(!j.ok)throw new Error(j.message);
    $("formWrap").style.display="none";$("ok").style.display="block";
    $("okTxt").textContent=EMP[c]+" ("+c+") · "+branch+" · "+io+" · "+$("d").textContent+", "+$("t").textContent;window.scrollTo(0,0);
  }catch(e){$("msg").textContent="Could not submit: "+(e.message||"check your internet")+". Try again.";btn.disabled=false;btn.textContent="Submit attendance"}
};
</script>
</body>
</html>
